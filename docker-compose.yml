services:
  rag-db:
    image: pgvector/pgvector:pg16
    container_name: rag-db
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_local
    ports:
      - "5433:5432"
    volumes:
      - rag-db-data:/var/lib/postgresql/data

  dynamodb-chat:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-chat
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    working_dir: /home/dynamodblocal
    user: root
    ports:
      - "8010:8000"
    volumes:
      - dynamodb-chat-data:/home/dynamodblocal/data

  dynamodb-chat-init:
    image: amazon/aws-cli:latest
    container_name: dynamodb-chat-init
    depends_on:
      - dynamodb-chat
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./dynamodb:/workspace/dynamodb:ro
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        until aws dynamodb list-tables \
          --endpoint-url http://dynamodb-chat:8000 \
          >/dev/null 2>&1
        do
          echo "Esperando DynamoDB Local..."
          sleep 2
        done

        if aws dynamodb describe-table \
          --table-name chatbot-historial \
          --endpoint-url http://dynamodb-chat:8000 \
          >/dev/null 2>&1
        then
          echo "La tabla chatbot-historial ya existe."
        else
          aws dynamodb create-table \
            --table-name chatbot-historial \
            --attribute-definitions \
              AttributeName=conversacionId,AttributeType=S \
              AttributeName=orden,AttributeType=S \
            --key-schema \
              AttributeName=conversacionId,KeyType=HASH \
              AttributeName=orden,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url http://dynamodb-chat:8000

          echo "Tabla chatbot-historial creada."
        fi

volumes:
  rag-db-data:
  dynamodb-chat-data: